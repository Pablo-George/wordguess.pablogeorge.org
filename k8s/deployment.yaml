apiVersion: v1
kind: Namespace
metadata:
  name: wordguess

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordguess-data
  namespace: wordguess
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordguess
  namespace: wordguess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordguess
  template:
    metadata:
      labels:
        app: wordguess
    spec:
      containers:
        - name: wordguess
          image: ghcr.io/pablo-george/wordguess.pablogeorge.org:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: "/app/data/wordguess.sqlite"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: wordguess-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wordguess-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: BASE_URL
              valueFrom:
                secretKeyRef:
                  name: wordguess-secrets
                  key: BASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: wordguess-secrets
                  key: SESSION_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wordguess-secrets
                  key: GEMINI_API_KEY
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wordguess-data

---
apiVersion: v1
kind: Service
metadata:
  name: wordguess
  namespace: wordguess
spec:
  selector:
    app: wordguess
  ports:
    - port: 3000
      targetPort: 3000
